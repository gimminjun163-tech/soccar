<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선수 커리어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* layout: 전광판 헤더 + 탭 아래 한 화면씩. 숫자는 전광판 서체, 나머지는 조용하게 */
:root{
  --bg:#edf1e9; --surface:#f9fbf6; --ink:#13201a; --muted:#5b6b61; --line:#cdd6ca;
  --turf:#1c7446; --turf-ink:#ffffff; --amber:#b97f00; --red:#c23b2b; --track:#dde4d9; --lv1:#c23b2b; --lv2:#d9731a; --lv3:#c9a400; --lv4:#7fae1e; --lv5:#1c7446;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#141f1a; --ink:#e5ece6; --muted:#8ea096; --line:#27362e;
  --turf:#42c07c; --turf-ink:#06130c; --amber:#f2c230; --red:#ff6f5b; --track:#1f2c25; --lv1:#ff6f5b; --lv2:#ff9a3d; --lv3:#f2c230; --lv4:#a6d94a; --lv5:#42c07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#141f1a; --ink:#e5ece6; --muted:#8ea096; --line:#27362e;
  --turf:#42c07c; --turf-ink:#06130c; --amber:#f2c230; --red:#ff6f5b; --track:#1f2c25; --lv1:#ff6f5b; --lv2:#ff9a3d; --lv3:#f2c230; --lv4:#a6d94a; --lv5:#42c07c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
#app{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.01em}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.good{color:var(--turf)} .bad{color:var(--red)} .amber{color:var(--amber)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.45em .8em;min-height:36px}
button:hover:not(:disabled){border-color:var(--turf)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf);font-weight:600}
button.on{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf);font-weight:600}
input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5em .7em;min-height:38px;max-width:100%}

/* 전광판 */
.board{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 18px}
.ovr{font-family:var(--display);line-height:1;text-align:center;min-width:72px}
.ovr b{font-weight:400;font-size:3.3rem;color:var(--amber);display:block}
.ovr span{font-size:.8rem;letter-spacing:.2em;opacity:.7}
:root .board .ovr b{color:#f2c230}
.who{flex:1 1 200px;min-width:0}
.who h1{font-family:var(--display);font-weight:400;font-size:1.7rem;overflow-wrap:anywhere}
.who p{opacity:.75;font-size:.88rem}
.meters{display:grid;grid-template-columns:repeat(5,auto);gap:4px 18px;margin:0;flex:0 1 auto}
.meters div{display:flex;flex-direction:column}
.meters dt{font-size:.72rem;letter-spacing:.08em;opacity:.65}
.meters dd{margin:0;font-family:var(--display);font-size:1.15rem}
@media (max-width:520px){.meters{grid-template-columns:repeat(2,auto);width:100%}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;border-radius:999px;padding-inline:1em}
.tabs button.on{background:var(--turf);color:var(--turf-ink);border-color:var(--turf);box-shadow:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}
.notice{border-left:3px solid var(--amber);padding:.4em .8em;background:var(--track);border-radius:0 6px 6px 0}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:.1em .6em;border-radius:999px;border:1px solid currentColor}

/* 능력치 */
.cat{font-size:.78rem;color:var(--muted);letter-spacing:.12em;border-bottom:1px solid var(--line);padding-bottom:2px;margin-top:4px}
.stat{display:grid;grid-template-columns:6.2em minmax(0,1fr) 3.4em auto;gap:10px;align-items:center}
.stat .v{font-family:var(--display);font-size:1.15rem;text-align:right}
.stat .v small{font-family:var(--body);font-size:.72rem;margin-left:2px}
input[type=range]{padding:0;border:0;width:100%;min-height:28px;accent-color:var(--turf);background:transparent}
.stat .key{color:var(--turf);font-weight:600}
.bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--turf);border-radius:5px}
.bar.thin{height:4px;margin-top:3px}.bar.thin i{background:var(--amber)}
.tend{display:flex;flex-direction:column;gap:3px}
.tend .ends{display:flex;justify-content:space-between;font-size:.84rem}
.tend .track{height:8px;background:var(--track);border-radius:4px;position:relative}
.tend .track b{position:absolute;top:-4px;width:6px;height:16px;border-radius:3px;background:var(--amber);transform:translateX(-3px)}

.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item>div{min-width:0}
.item button{flex:none}

/* 중계 */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .t{font-weight:600;overflow-wrap:anywhere}
.score .n{font-family:var(--display);font-size:2.6rem;line-height:1}
.clock{font-family:var(--display);color:var(--amber);font-size:1.1rem}
.feed{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.feed p{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.feed p:first-child{border-top:0}
.feed .m{font-family:var(--display);color:var(--muted)}
.feed .goal{font-weight:600;color:var(--turf)}
.feed .conc{font-weight:600;color:var(--red)}
.feed .me{box-shadow:inset 3px 0 0 var(--amber)}
.reps{display:flex;gap:6px}
.reps span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.reps .ok{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.reps .no{border-color:var(--red);color:var(--red)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:.78rem;color:var(--muted);font-weight:500}
th,td{white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
table.race{min-width:300px}
table.race th:nth-child(3),table.race td:nth-child(3){text-align:left}
tr.mine td{font-weight:600;color:var(--turf)}
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.posgrid button{text-align:left;display:flex;flex-direction:column;line-height:1.3}
.posgrid button b{font-family:var(--display);font-weight:400;font-size:1.2rem}
</style>
</head>

function mkName(lg,used){const[a,b]=NAMES[lg]||NAMES.epl;for(let i=0;i<40;i++){const x=pick(a),y=pick(b),n=lg==='k'?x+y:lg==='jpn'?x+' '+y:y+' '+x;if(!used[n]){used[n]=1;return n}}return pick(b)+' '+pick(a)+' '+ri(2,9)}
/* 팀마다 주포 1명과 플레이메이커 1명. p[t*2]=주포, p[t*2+1]=플레이메이커 */
function distGoals(t,n,noAssist){const p=g.race.p,ace=p[t*2],pm=p[t*2+1];
  for(let i=0;i<n;i++){const r=R(),free=!(i<(noAssist||0));
    if(r<ace.sh){ace.g++;if(free&&R()<pm.as)pm.a++}
    else if(r<ace.sh+.12){pm.g++;if(free&&R()<.15)ace.a++}
    else if(free){if(R()<pm.as)pm.a++;else if(R()<.12)ace.a++}}}
function ensureRace(){
  if(g.stats.sho==null){const P=POS[g.pos],old=Math.round(OLDK.reduce((t,k,i)=>t+P.w0[i]*g.stats[k],0));
    STATS.forEach(([k])=>{if(g.stats[k]!=null)return;let a=0,b=0,c=0,d=0;
      OLDK.forEach((o,i)=>{const f=SPLIT[o][k];if(f){a+=f*P.w0[i]*g.stats[o];b+=f*P.w0[i];c+=f*g.stats[o];d+=f}});
      g.stats[k]=Math.round(b>0?a/b:c/d);g.gauge[k]=0});
    const top=STATS.filter(([k])=>!OLDK.includes(k)).sort((x,y)=>POS[g.pos].w[STATS.findIndex(z=>z[0]===y[0])]-POS[g.pos].w[STATS.findIndex(z=>z[0]===x[0])])[0][0];
    let n=0;while(ovr()<old&&g.stats[top]<99&&n++<40)g.stats[top]++;while(ovr()>old&&n++<80)g.stats[top]--}
  g.hist=g.hist||[];g.y0=g.y0||2025;g.nt=g.nt||{caps:0,goals:0,assists:0,titles:[]};
  if(g.race&&g.race.season===g.season&&g.race.lg===g.league&&g.race.p.length===g.teams.length*2)return;
  const used={},p=[];
  g.teams.forEach((t,i)=>{p.push({n:mkName(g.league,used),t:i,g:0,a:0,sh:.26+R()*.2,as:.2});p.push({n:mkName(g.league,used),t:i,g:0,a:0,sh:0,as:.2+R()*.18})});
  g.race={season:g.season,lg:g.league,p};
  /* 이미 진행된 시즌이면 지금까지의 팀 득점을 선수들에게 나눠 준다 */
  g.teams.forEach((t,i)=>distGoals(i,Math.max(0,t.gf-(i===g.club?g.ss.goals:0))));
}

/* ---------- 훈련 ---------- */
function train(id){
  if(g.phase!=='week'||busy()||g.trainLeft<=0||ui.train&&ui.train.shown<ui.train.reps.length)return;
  g.trainLeft--;g.trained++;
  if(id==='rest'){g.cond=cl(g.cond+20);ui.train={n:'휴식',reps:[],shown:0,text:'푹 쉬었습니다. 컨디션 +20.'};save();return render()}
  const d=DRILLS.find(x=>x.id===id),p=cl(.35+g.stats[id]/200+(g.tend.pro-50)/300+(g.cond-70)/300,.15,.95);
  const reps=[...Array(5)].map(()=>R()<p),okc=reps.filter(Boolean).length;
  const gain=Math.round((10+okc*5)*(g.perks.gear?1.2:1)*(1+(g.tend.pro-50)/200));
  const ups=[];d.g.forEach((k,i)=>{g.gauge[k]+=Math.round(gain*(i?.6:1));while(g.gauge[k]>=100&&g.stats[k]<99){g.gauge[k]-=100;g.stats[k]++;ups.push(SN[k]+' +1')}if(g.stats[k]>=99)g.gauge[k]=0});
  const tr=1+(okc>=4?1:0);g.trust=cl(g.trust+tr);g.cond=cl(g.cond-8);
  ui.train={n:d.n,d,reps,shown:0,text:`${okc}/5 성공 · ${SN[d.g[0]]} 숙련도 +${gain}, ${d.g.slice(1).map(k=>SN[k]).join('·')} +${Math.round(gain*.6)}${ups.length?` · ${ups.join(', ')}!`:''} · 신임 +${tr} · 컨디션 -8`};
  save();render();
  const step=()=>{if(!ui.train)return;ui.train.shown++;render();if(ui.train.shown<5)setTimeout(step,330)};
  setTimeout(step,330);
}

/* ---------- 상점 · 투자 ---------- */
function buy(id){
  const it=SHOP.find(x=>x.id===id);if(busy())return;
  if(it.perk?g.perks[id]:g.bought[id])return;
  if(g.money<it.c){ui.msg='자금이 부족합니다.';return}
  g.money-=it.c;if(it.perk)g.perks[id]=1;else g.bought[id]=1;
  const e=it.e||{};
  for(const k of['style','bold','pro','calm'])if(e[k])g.tend[k]=cl(g.tend[k]+e[k]);
  if(e.cond)g.cond=cl(g.cond+e.cond);if(e.trust)g.trust=cl(g.trust+e.trust);
  ui.msg=`${it.n} 완료. ${it.d}`;
}
function invBuy(id,amt){const a=amt==='all'?g.money:Math.min(+amt,g.money);if(a<=0){ui.msg='자금이 부족합니다.';return}
  g.money-=a;g.inv[id].v+=a;g.inv[id].p+=a;ui.msg=`${INV[id].n}에 ${won(a)} 투자했습니다.`}
function invSell(id,amt){const o=g.inv[id];if(o.v<1){return}
  if(amt==='all'||o.v<=+amt){g.money+=Math.round(o.v);ui.msg=`${INV[id].n} ${won(o.v)} 전액 회수.`;o.v=0;o.p=0;return}
  const a=+amt;o.p-=o.p*a/o.v;o.v-=a;g.money+=a;ui.msg=`${INV[id].n}에서 ${won(a)} 회수했습니다.`}

/* ---------- 성장 ---------- */
function upStat(k){const c=cost(k);if(g.exp<c||g.stats[k]>=99)return false;g.exp-=c;g.stats[k]++;return true}
function autoUp(){let n=0;for(;;){let best=null,bv=0;
  STATS.forEach(([k],i)=>{const c=cost(k);if(c<=g.exp&&g.stats[k]<99){const v=POS[g.pos].w[i]/c;if(v>bv){bv=v;best=k}}});
  if(!best)break;upStat(best);n++}
  ui.msg=n?`자동 분배로 능력치 ${n}포인트를 올렸습니다.`:'EXP가 부족합니다.'}

            if(R()<(risky?.4:.25)){M.assists++;M.rating+=.7;line(`골! ${N}의 ${risky?'과감한 스루패스':'패스'}가 수비 뒤를 갈랐고 동료가 마무리합니다. 도움 기록!`+goal(true),'goal me')}

function vHeader(){const t=g.teams[g.club];
  return `<header class="board"><div class="ovr"><b>${ovr()}</b><span>OVR</span></div>
  <div class="who"><h1>${esc(g.name)}</h1><p>${LEAGUES[g.league].n} · ${t.n} · ${POS[g.pos].n} · ${g.age}세 (${g.y0-18}년생) · ${g.ht}cm ${g.wt}kg</p><p>${dateStr()} · ${seasonLabel(g.season)} 시즌 ${g.week+1}/${W()}주</p></div>
  <dl class="meters"><div><dt>나이</dt><dd>${g.age}세</dd></div><div><dt>자금</dt><dd>${won(g.money)}</dd></div><div><dt>컨디션</dt><dd>${g.cond}</dd></div><div><dt>신임</dt><dd>${g.trust}</dd></div><div><dt>EXP</dt><dd>${g.exp}</dd></div></dl></header>
  <nav class="tabs">${[['home','이번 주'],['train','훈련'],['match','경기'],['grow','능력치'],['money','자금'],['league','리그']].map(([k,n])=>`<button data-act="tab" data-arg="${k}" class="${ui.tab===k?'on':''}">${n}</button>`).join('')}</nav>
  ${ui.msg?`<p class="notice">${esc(ui.msg)}</p>`:''}`}
function roleCard(){const r=roleInfo(),col=r.key==='start'?'good':r.key==='bench'?'amber':'bad';
  return `<p>감독의 구상: <span class="tag ${col}">${ROLE[r.key]}</span></p>
  <div class="bar"><i style="width:${cl(r.sc)}%"></i></div>
  <p class="small muted">${r.away?'대표팀 차출 중이라 이번 주 리그 경기는 결장합니다. 신임은 깎이지 않습니다.':r.key==='start'?'지금 평가라면 선발입니다. 컨디션이 50 아래면 후반에 교체됩니다.':`선발까지 평가 ${r.need}점이 더 필요합니다. 신임, 경쟁자 대비 OVR, 컨디션이 반영됩니다.`}</p>`}
function vHome(){
  if(g.phase==='end'){const e=g.end;return `<div class="panel"><h2>${seasonLabel(g.season)} 시즌 결산</h2>
   <p>리그 <b>${e.rank}위</b> · 상금 ${won(e.prize)} · ${e.apps}경기 ${e.goals}골 ${e.assists}도움 · 평균 평점 ${e.avg}</p>
   ${e.gRank?`<p>득점 <b>${e.gRank}위</b> · 도움 <b>${e.aRank}위</b>${e.award?` · 개인상 상금 ${won(e.award)}`:''}</p><p class="small muted">득점왕 ${esc(e.gTop.n)} ${e.gTop.v}골 · 도움왕 ${esc(e.aTop.n)} ${e.aTop.v}도움</p>`:''}
   ${tourCard()}
   ${e.offers.length?`<p class="notice">이적 제안이 왔습니다. 옮기면 신임은 40에서 다시 시작하고 주급은 새 리그 기준으로 정해집니다.</p>${e.offers.map((o,i)=>`<div class="item"><div><b>${o.n}</b><p class="small muted">${LEAGUES[o.l].n} · 전력 ${o.s}</p></div><button data-act="season" data-arg="${i}">이적</button></div>`).join('')}`:''}
   <div class="row"><button class="primary" data-act="season" data-arg="">${g.teams[g.club].n}에 남아 새 시즌 시작</button></div></div>`}
  const f=fixture(),o=g.teams[f.opp];
  return `<div class="cols"><div class="panel"><h2>${g.week+1}주차 일정</h2><p class="small muted">${dateStr()}</p>
   <p>${f.home?'홈':'원정'} · <b>${o.n}</b> (전력 ${o.str}) · 우리 팀 전력 ${g.teams[g.club].str}</p>${roleCard()}
   <p class="small muted">남은 훈련 ${g.trainLeft}회 · 주급 ${won(g.wage)}</p>
   <div class="row">${g.phase==='week'&&!M?`<button data-act="tab" data-arg="train">훈련하러 가기</button><button class="primary" data-act="match">경기 시작</button>`:g.phase==='post'?`<button class="primary" data-act="next">다음 주로</button>`:`<button data-act="tab" data-arg="match">중계 보기</button>`}</div></div>
  <div class="panel"><h2>시즌 기록</h2><p>${g.ss.apps}경기 · ${g.ss.goals}골 · ${g.ss.assists}도움 · 평균 평점 ${g.ss.apps?(g.ss.rat/g.ss.apps).toFixed(2):'-'}</p>
   ${(r=>`<p>리그 득점 <b>${r.gRank}위</b> · 도움 <b>${r.aRank}위</b> <button data-act="tab" data-arg="league">경쟁 보기</button></p>`)(raceInfo())}
   <p class="small muted">통산 ${g.car.apps}경기 ${g.car.goals}골 ${g.car.assists}도움</p>
   <h3>소식</h3>${g.news.slice(0,7).map(n=>`<p class="small">${esc(n)}</p>`).join('')}</div></div>
  ${natPanel()}
  <div class="panel">${ui.confirmReset?`<p>지금 커리어를 지우고 처음부터 시작할까요?</p><div class="row"><button data-act="resetYes">지우고 새로 시작</button><button data-act="resetNo">취소</button></div>`:`<div class="row spread"><span class="small muted">진행 상황은 이 브라우저에 자동 저장됩니다.</span><button data-act="reset">새 커리어</button></div>`}</div>`}
function vTrain(){const can=g.phase==='week'&&!busy()&&g.trainLeft>0&&!(ui.train&&ui.train.shown<ui.train.reps.length),t=ui.train;
  return `<div class="panel"><div class="row spread"><h2>훈련</h2><span>남은 횟수 ${g.trainLeft}/2</span></div>
  <p class="small muted">5세트를 시뮬레이션합니다. 훈련마다 능력치 두세 개가 함께 오릅니다. 성공할수록 숙련도가 많이 오르고, 100이 차면 능력치가 +1 됩니다. 한 번에 컨디션 -8, 신임 +1~2.</p>
  ${t?`<div class="panel"><h3>${t.n}</h3>${t.reps.length?`<div class="reps">${t.reps.map((r,i)=>i<t.shown?`<span class="${r?'ok':'no'}">${r?'O':'X'}</span>`:`<span>${i+1}</span>`).join('')}</div>
   ${t.shown?`<p class="small">${t.shown}세트: ${t.reps[t.shown-1]?t.d.ok:t.d.no}</p>`:'<p class="small muted">준비 중…</p>'}`:''}
   ${t.shown>=t.reps.length?`<p><b>${t.text}</b></p>`:''}</div>`:''}
  <div class="posgrid">${DRILLS.map(d=>`<button data-act="train" data-arg="${d.id}" ${can?'':'disabled'}><b>${g.stats[d.id]}</b><span class="small">${d.n}</span><span class="small muted">${d.g.map(k=>SN[k]).join(' · ')}</span></button>`).join('')}
   <button data-act="train" data-arg="rest" ${can?'':'disabled'}><b>+20</b><span class="small">휴식</span><span class="small muted">컨디션 회복</span></button></div>
  ${g.phase!=='week'?'<p class="small muted">이번 주 경기가 끝났습니다. 다음 주에 다시 훈련할 수 있습니다.</p>':''}</div>`}
function vMatch(){
  if(g.phase==='end'&&!M)return `<div class="panel"><p>시즌이 끝났습니다. '이번 주' 탭에서 결산을 확인하세요.</p></div>`;
  if(!M){const f=fixture(),o=g.teams[f.opp];
    return `<div class="panel"><h2>${f.home?'홈':'원정'} · ${o.n}전</h2>${roleCard()}
    <p class="small muted">경기를 시작하면 이번 주 훈련은 더 할 수 없습니다. 남은 훈련 ${g.trainLeft}회.</p>
    <div class="row"><button class="primary" data-act="match">경기 시작</button></div></div>`}
  const T=M.T.n,O=M.O.n,L=g.last;
  return `<div class="panel">${M.intl?`<p><span class="tag ${M.intl.kind==='tour'?'amber':''}">${M.intl.kind==='tour'?'컵 대회':'친선'}</span> <span class="small muted">${M.intl.label}</span></p>`:''}<div class="score"><span class="t">${T}</span><span><span class="n">${M.my} : ${M.op}</span><br><span class="clock">${M.done?'종료':M.min+"'"}</span></span><span class="t">${O}</span></div>
  ${M.done?'':`<div class="row"><button data-act="speed" data-arg="1" class="${M.speed===1?'on':''}">x1</button><button data-act="speed" data-arg="2" class="${M.speed===2?'on':''}">x2</button><button data-act="skip">건너뛰기</button></div>`}
  <div class="feed" id="feed">${M.lines.map(l=>`<p class="${l.c}"><span class="m">${l.m}'</span><span>${esc(l.t)}</span></p>`).join('')}</div>
  ${M.done&&L?`<div class="panel"><h3>경기 후 정산</h3>
   ${L.played?`<p>${L.played}분 출전 · 평점 <b>${L.rating.toFixed(1)}</b> · ${L.goals}골 ${L.assists}도움 · 슛 ${L.shots} · 키패스 ${L.keyp} · 돌파 ${L.drib} · 수비 성공 ${L.tack}</p>`:'<p>오늘은 출전하지 못했습니다.</p>'}
   <p><b class="good">EXP +${L.exp}</b> · 수당 ${won(L.bonus)}${L.intl?'':` · 신임 ${L.dt>=0?'+':''}${L.dt}`}</p>${L.extra?`<p><b>${L.extra}</b></p>`:''}
   <div class="row"><button data-act="tab" data-arg="grow">EXP 분배하기</button>${g.tour?`<button class="${g.tour.done?'':'primary'}" data-act="tab" data-arg="home">${g.tour.name} 현황</button>`:''}${g.phase==='end'?'':`${canFriendly()?`<button data-act="intl" data-arg="fr">친선전 치르기 (${g.fr.n})</button>`:''}<button class="${g.tour&&!g.tour.done?'':'primary'}" data-act="next">다음 주로</button>`}</div></div>`:''}</div>`}
function vGrow(){
  return `<div class="cols"><div class="panel"><div class="row spread"><h2>능력치</h2><span>보유 EXP <b>${g.exp}</b></span></div>
  <p class="small muted">버튼의 숫자가 필요한 EXP입니다. 능력치가 높을수록 비쌉니다. 노란 선은 훈련 숙련도입니다.</p>
  ${statRows(g.stats,g.pos,{btn:1,gauge:1,mod:bodyMod(g.ht,g.wt)})}
  <div class="row"><button class="primary" data-act="auto">자동 분배</button><span class="small muted">포지션에 가장 효율적인 능력치부터 올립니다.</span></div></div>
  <div class="panel"><h2>성향</h2>${TEND.map(([k,a,b,d])=>`<div class="tend"><div class="ends"><span>${a}</span><span>${b}</span></div><div class="track"><b style="left:${g.tend[k]}%"></b></div><p class="small muted">${d}</p></div>`).join('')}
  <p class="small muted">성향은 '자금' 탭의 활동과 제품으로 바꿉니다.</p>
  <h3>체격</h3><p>${g.ht}cm · ${g.wt}kg</p><p class="small muted">${bodyText(g.ht,g.wt)}</p>
  <div class="row"><button data-act="wt" data-arg="-1">감량 -1kg · 30만원</button><button data-act="wt" data-arg="1">증량 +1kg · 30만원</button></div>
  <p class="small muted">키가 크고 무거울수록 피지컬이 좋아지고 속도와 드리블이 떨어집니다. 능력치 옆 작은 숫자가 체격 보정이고, 키는 바꿀 수 없습니다.</p>
  <h3>포지션 변경</h3><div class="row"><select id="possel">${Object.keys(POS).map(p=>`<option value="${p}" ${p===g.pos?'selected':''}>${POS[p].n}</option>`).join('')}</select><button data-act="cpos">변경</button></div>
  <p class="small muted">능력치는 그대로이고 OVR만 새 포지션 기준으로 다시 계산됩니다. 신임 -10.</p></div></div>`}
function vMoney(){const tot=Object.values(g.inv).reduce((s,o)=>s+o.v,0);
  return `<div class="cols"><div class="panel"><h2>활동과 제품</h2><p class="small muted">활동은 주 1회씩, 제품은 한 번만 살 수 있습니다.</p>
  ${SHOP.map(it=>{const done=it.perk?g.perks[it.id]:g.bought[it.id];return `<div class="item"><div><b>${it.n}</b><p class="small muted">${it.d}</p></div><button data-act="buy" data-arg="${it.id}" ${done||busy()||g.money<it.c?'disabled':''}>${done?(it.perk?'보유 중':'이번 주 완료'):won(it.c)}</button></div>`}).join('')}</div>
  <div class="panel"><div class="row spread"><h2>투자</h2><span>평가액 ${won(tot)}</span></div><p class="small muted">수익률은 매주 '다음 주로' 넘어갈 때 반영됩니다. 주급 ${won(g.wage)}.</p>
  ${Object.keys(INV).map(k=>{const o=g.inv[k],pl=o.v-o.p;return `<div class="item" style="flex-direction:column;align-items:stretch"><div><b>${INV[k].n}</b> <span class="small muted">${INV[k].d}</span>
   <p>보유 ${won(o.v)} ${o.p>0?`<span class="${pl>=0?'good':'bad'}">(${pl>=0?'+':''}${won(pl)})</span>`:''} ${o.ch?`<span class="small ${o.ch>=0?'good':'bad'}">지난주 ${(o.ch*100).toFixed(1)}%</span>`:''}</p></div>
   <div class="row"><button data-act="ib" data-arg="${k}:100">+100만</button><button data-act="ib" data-arg="${k}:500">+500만</button><button data-act="ib" data-arg="${k}:all">전액 투자</button><button data-act="is" data-arg="${k}:100">-100만</button><button data-act="is" data-arg="${k}:all">전액 회수</button></div></div>`}).join('')}</div></div>`}
function vLeague(){const rc=raceInfo(),live=g.phase==='end'?[]:[{s:g.season,lg:LEAGUES[g.league].n,club:g.teams[g.club].n,apps:g.ss.apps,goals:g.ss.goals,assists:g.ss.assists,avg:g.ss.apps?(g.ss.rat/g.ss.apps).toFixed(2):'-',rank:table().findIndex(x=>x.i===g.club)+1,gRank:rc.gRank,aRank:rc.aRank,live:1}],hs=g.hist.concat(live).reverse();
  return `<div class="panel"><h2>${LEAGUES[g.league].n} ${seasonLabel(g.season)} 순위</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody>
  ${table().map((t,i)=>`<tr class="${t.i===g.club?'mine':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gd>0?'+':''}${t.gd}</td><td>${t.pts}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="cols">${raceTable(rc.gList,'g','골','득점왕 경쟁',rc.gRank)}${raceTable(rc.aList,'a','도움','도움왕 경쟁',rc.aRank)}</div>
  <div class="panel"><h2>시즌별 내 기록</h2><div class="tablewrap"><table><thead><tr><th>시즌</th><th>나이</th><th>팀</th><th>경기</th><th>골</th><th>도움</th><th>평점</th><th>팀 순위</th><th>득점</th><th>도움</th></tr></thead><tbody>
  ${hs.map(h=>`<tr class="${h.live?'mine':''}"><td>${seasonLabel(h.s)}${h.live?' 진행 중':''}</td><td>${g.age-(g.season-h.s)}세</td><td>${h.club}<br><span class="small muted">${h.lg}</span></td><td>${h.apps}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.avg}</td><td>${h.rank}위</td><td>${h.gRank}위</td><td>${h.aRank}위</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">통산 ${g.car.apps}경기 ${g.car.goals}골 ${g.car.assists}도움. 득점왕은 리그 배율에 따라 500만원부터, 도움왕은 300만원부터 상금을 받습니다.</p></div>
  <div class="panel"><h2>내 경기 기록</h2>${g.results.length?`<div class="tablewrap"><table><thead><tr><th>주</th><th>상대</th><th>결과</th><th>평점</th><th>기록</th></tr></thead><tbody>${g.results.map(r=>`<tr><td>${seasonLabel(r.s)} ${r.w}주</td><td>${r.home?'홈':'원정'} ${r.opp}</td><td>${r.sc} ${r.r}</td><td>${r.rating?r.rating.toFixed(1):'-'}</td><td>${r.rating?r.ga:'-'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 치른 경기가 없습니다.</p>'}</div>`}
function render(){
  const app=document.getElementById('app');
  if(!g){app.innerHTML=vSetup();return}
  app.innerHTML=vHeader()+({home:vHome,train:vTrain,match:vMatch,grow:vGrow,money:vMoney,league:vLeague}[ui.tab])();
  const f=document.getElementById('feed');if(f)f.scrollTop=f.scrollHeight;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,x=b.dataset.arg;ui.msg='';
  if(a==='spos'){readSetup();ui.setupPos=x}
  else if(a==='begin'){readSetup();const n=ui.setupName.trim();
    if(!n){ui.msg='이름을 입력하세요.'}else{newGame(n,ui.setupPos,ui.setupLeague,ui.setupClub,ui.ht,ui.wt,ui.y0,ui.nat);ui.tab='home'}}
  else if(a==='tab')ui.tab=x;
  else if(a==='train')return train(x);
  else if(a==='buy')buy(x);
  else if(a==='ib'){const[k,v]=x.split(':');invBuy(k,v)}
  else if(a==='is'){const[k,v]=x.split(':');invSell(k,v)}
  else if(a==='up')upStat(x);
  else if(a==='auto')autoUp();
  else if(a==='match')return startMatch();
  else if(a==='intl')return startIntl(x);
  else if(a==='setnat'){g.nat=+document.getElementById('natpick').value;ui.msg=`국적을 ${NATIONS[g.nat].n}(으)로 정했습니다.`}
  else if(a==='speed'){if(M)M.speed=+x}
  else if(a==='skip')return skipMatch();
  else if(a==='next')nextWeek();
  else if(a==='season')newSeason(x);
  else if(a==='wt')changeWt(+x);
  else if(a==='cpos')changePos(document.getElementById('possel').value);
  else if(a==='reset')ui.confirmReset=true;
  else if(a==='resetNo')ui.confirmReset=false;
  else if(a==='resetYes'){if(M)clearTimeout(M.timer);M=null;g=null;ui.confirmReset=false;ui.train=null;try{localStorage.removeItem('career-save')}catch(e){}}
  if(g&&!busy())save();
  render();
});
document.addEventListener('input',e=>{const id=e.target.id;if(g||(id!=='ht'&&id!=='wt'))return;
  const h=+document.getElementById('ht').value,w=+document.getElementById('wt').value;
  document.getElementById('htv').textContent=h;document.getElementById('wtv').textContent=w;document.getElementById('bodytx').textContent=bodyText(h,w)});
document.addEventListener('change',e=>{if(g||!['lgsel','clubsel','ht','wt'].includes(e.target.id))return;
  const prev=ui.setupLeague;readSetup();if(ui.setupLeague!==prev)ui.setupClub=weakest(ui.setupLeague);render()});
function start(d){g=(d&&d.g&&d.g.v===2?d.g:null)||load();if(g)ensureRace();if(g&&g.phase==='post'){/* 중계 화면은 저장되지 않으므로 정산만 이어감 */ui.tab='home'}render()}
window.claude?.hot?.snapshot?.(()=>({g}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
